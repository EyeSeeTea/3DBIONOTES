name: '3dbionotes-ruby'
services:
  web:
    container_name: web-ruby
    tty: true
    command: bash -c "bundle exec rake db:migrate RAILS_ENV=development && bundle exec rake assets:precompile && bundle exec rails s -p 3000 -b '0.0.0.0'"
    depends_on:
            db:
                condition: service_healthy

  # Data Base web interface
  # used during development for easy access to tables and data
  pma:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - "${PMA_EXT_PORT}:80"
    depends_on:
            db:
                condition: service_healthy